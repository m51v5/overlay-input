[package]
name = "overlay_input"
version = "0.1.0"
edition = "2024"
description = "Click-through desktop overlay that shows keyboard, mouse and gamepad input"
license = "MIT"
build = "build.rs"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "glow", "links"] }
egui = "0.37"
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
global-hotkey = "0.9"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
notify = "8.2.0"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tiny-skia = "0.12"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26"
usvg = { version = "0.49", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30"

[build-dependencies]
embed-resource = "3.0.12"

# Debug builds draw 20-50x slower unoptimized (tiny-skia), which shows as input lag; optimize anyway.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
